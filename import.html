*{box-sizing:border-box;margin:0;padding:0}
body{background:#F2F4F7;font-family:'Helvetica Neue',Arial,sans-serif;color:#1A3A5C;padding:12px;max-width:640px;margin:0 auto}
h1{font-size:18px;margin:6px 0 4px}
.sub{font-size:12px;color:#666;margin-bottom:12px;line-height:1.6}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:12px;overflow:hidden}
.card h2{font-size:15px;background:#1A3A5C;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pad{padding:12px 14px}
input,select{width:100%;padding:11px 12px;font-size:15px;border:1.5px solid #D0D7E3;border-radius:10px;margin-bottom:10px;color:#1A3A5C;background:#fff}
button{width:100%;padding:14px;border:none;border-radius:12px;background:#1A3A5C;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{background:#BCC3CF}
.sum{font-size:13px;line-height:1.8}
.sum b{font-size:14px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:5px 6px;border-bottom:1px solid #EEF1F5;text-align:right;white-space:nowrap}
th{background:#F8FAFC;color:#666;font-weight:600}
td:first-child,th:first-child{text-align:left}
td.l{text-align:left;white-space:normal;color:#666}
tr.skip td{color:#999;background:#FAFAFA}
tr.warn td{background:#FEF2F2;color:#B91C1C}
.tag{display:inline-block;padding:1px 6px;border-radius:6px;font-size:11px;font-weight:700}
.new{background:#DCFCE7;color:#15803D}.sk{background:#E5E7EB;color:#555}.ng{background:#FEE2E2;color:#B91C1C}
details summary{padding:10px 14px;font-size:13px;cursor:pointer;color:#2563A8}
.msg{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;line-height:1.6}
.err{background:#FEF2F2;color:#DC2626}.ok{background:#F0FDF4;color:#15803D}.info{background:#FFF7ED;color:#C2410C}
.mono{font-variant-numeric:tabular-nums}
</style>

const ORDER = ["川岸","宮本","原田","松浦"];
const RANGE = {"川岸":"1月〜4月","宮本":"1月〜4月","原田":"1月〜4月","松浦":"1月〜5月"};

const DEFAULT_RATES={SS:{delivery:260,pickup:100},S:{delivery:520,pickup:150},A:{delivery:750,pickup:330},B:{delivery:800,pickup:430},C:{delivery:1580,pickup:540},D:{delivery:2600,pickup:900},E:{delivery:3090,pickup:1550},F:{delivery:3280,pickup:2290},G:{delivery:4080,pickup:2780}};
const SIZES=Object.keys(DEFAULT_RATES);
let RATES=DEFAULT_RATES, STAFF=[], PLAN={}, busy=false;

const $=s=>document.querySelector(s);
const yen=n=>"¥"+n.toLocaleString("ja-JP");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dl=d=>{const x=new Date(d+"T00:00:00");return `${x.getMonth()+1}/${x.getDate()}(${"日月火水木金土"[x.getDay()]})`};
const base=e=>SIZES.reduce((t,s)=>t+(parseInt(e?.[s]?.delivery)||0)*RATES[s].delivery+(parseInt(e?.[s]?.pickup)||0)*RATES[s].pickup,0);
const opt=e=>(e?.options||[]).reduce((t,o)=>t+(parseInt(o.amount)||0),0);
const total=e=>base(e)+opt(e);
const detail=e=>{const f=k=>SIZES.map(s=>{const n=parseInt(e?.[s]?.[k])||0;return n?s+n:""}).filter(Boolean).join(" ");const a=f("delivery"),b=f("pickup");return [a&&"配 "+a,b&&"集 "+b,...(e.options||[]).map(o=>`${o.label} ${o.amount}`),e.memo&&"📝"+e.memo].filter(Boolean).join(" / ")};
function msg(html,cls){$("#msg").innerHTML=html?`<div class="msg ${cls}">${html}</div>`:""}

window.doLogin=async()=>{
  const em=$("#em").value.trim(), pw=$("#pw").value;
  if(!em||!pw) return msg("メールアドレスとパスワードを入力してください","err");
  try{ await signInWithEmailAndPassword(auth,em,pw); }catch{ msg("ログインできませんでした","err"); }
};

onAuthStateChanged(auth, async u=>{
  if(!u){ $("#login").style.display="block"; $("#main").style.display="none"; return; }
  $("#login").style.display="none"; msg("読み込み中…","info");
  try{
    const me=await getDoc(doc(db,"users",u.uid));
    if(!me.exists()||me.data().role!=="admin"){ msg("管理者アカウントでログインしてください","err"); return; }
    const r=await getDoc(doc(db,"settings","rates")); if(r.exists()) RATES=r.data();
    STAFF=(await getDocs(collection(db,"users"))).docs.map(d=>({uid:d.id,...d.data()}));
    $("#main").style.display="block";
    renderPickers(); await buildPlan();
  }catch(e){ msg("読み込みに失敗しました: "+esc(e.message),"err"); }
});

function renderPickers(){
  $("#pickers").innerHTML=ORDER.map(k=>{
    const hit=STAFF.filter(s=>(s.name||"").replace(/\s/g,"").startsWith(k));
    const opts=['<option value="">（取り込まない）</option>',...STAFF.map(s=>`<option value="${s.uid}" ${hit.length===1&&hit[0].uid===s.uid?"selected":""}>${esc(s.name)}</option>`)].join("");
    return `<div style="font-size:12px;color:#555;font-weight:600;margin-bottom:4px">Excel「${k}」（${RANGE[k]}）→ アプリのスタッフ</div><select data-k="${k}" onchange="buildPlan()">${opts}</select>`;
  }).join("");
}

window.buildPlan=async()=>{
  if(busy) return; busy=true; msg("アプリの記録と照合中…","info"); $("#go").disabled=true;
  PLAN={}; const uids=[];
  for(const sel of document.querySelectorAll("#pickers select")){
    const k=sel.dataset.k, uid=sel.value; if(!uid) continue;
    if(uids.includes(uid)){ msg("同じスタッフが2回選ばれています","err"); busy=false; return; }
    uids.push(uid);
    const snap=await getDocs(query(collection(db,"records"),where("uid","==",uid)));
    const have={}; snap.docs.forEach(d=>{const x=d.data(); have[x.date]=x.entry;});
    PLAN[k]={uid,name:STAFF.find(s=>s.uid===uid)?.name,rows:DATA[k].map(r=>({...r,calc:total(r.entry),existing:have[r.date]}))};
  }
  render(); busy=false;
};

function render(){
  let html="", nNew=0, nWarn=0;
  for(const k of ORDER){
    const p=PLAN[k]; if(!p) continue;
    const news=p.rows.filter(r=>!r.existing), skips=p.rows.filter(r=>r.existing);
    const warns=news.filter(r=>r.calc!==r.excelTotal);
    nNew+=news.length; nWarn+=warns.length;
    const months={}; news.forEach(r=>{const m=+r.date.slice(5,7);(months[m]=months[m]||{d:0,t:0});months[m].d++;months[m].t+=r.calc;});
    const rows=p.rows.map(r=>{
      const st=r.existing?`<span class="tag sk">入力済み・スキップ</span>`:(r.calc!==r.excelTotal?`<span class="tag ng">金額不一致</span>`:`<span class="tag new">新規</span>`);
      const ex=r.existing?`アプリ ${yen(total(r.existing))}`+(total(r.existing)!==r.excelTotal?" ⚠️Excelと違う":""):"";
      return `<tr class="${r.existing?"skip":(r.calc!==r.excelTotal?"warn":"")}"><td>${dl(r.date)}</td><td class="mono">${yen(r.excelTotal)}</td><td>${st}</td></tr><tr class="${r.existing?"skip":""}"><td colspan="3" class="l">${esc(detail(r.entry))}${ex?" ｜ "+ex:""}</td></tr>`;
    }).join("");
    html+=`<div class="card"><h2><span>${esc(k)} → ${esc(p.name)}</span><span style="font-size:12px">${RANGE[k]}</span></h2>
      <div class="pad sum">新しく入る日：<b>${news.length}日</b>（${yen(news.reduce((t,r)=>t+r.calc,0))}）<br>
      ${Object.entries(months).map(([m,v])=>`${m}月 ${v.d}日 ${yen(v.t)}`).join("　")}<br>
      スキップ（アプリに入力済み）：<b>${skips.length}日</b>${skips.length?"（"+skips.map(r=>dl(r.date)).join(" ")+"）":""}</div>
      <details><summary>1日ごとの内容を見る（${p.rows.length}日）</summary><table><tr><th>日付</th><th>売上</th><th>状態</th></tr>${rows}</table></details></div>`;
  }
  $("#plan").innerHTML=html;
  if(nWarn) msg(`現在の単価で計算するとExcelと金額が合わない日が ${nWarn} 日あります。単価管理の設定を確認してください（このままでは登録できません）。`,"err");
  else if(!nNew) msg(Object.keys(PLAN).length?"新しく入る記録はありません（すべて入力済み）。":"スタッフを選んでください。","ok");
  else msg(`新しく入る記録は合計 <b>${nNew}日</b> です。内容を確認してから下のボタンを押してください。アプリに入力済みの日は変更しません。`,"info");
  $("#go").disabled=!!nWarn||!nNew;
}

window.runImport=async()=>{
  const todo=[]; ORDER.forEach(k=>{const p=PLAN[k]; if(p) p.rows.filter(r=>!r.existing).forEach(r=>todo.push({...r,uid:p.uid,k}));});
  if(!todo.length||!confirm(`${todo.length}日分の記録を登録します。よろしいですか？`)) return;
  busy=true; $("#go").disabled=true; let done=0;
  try{
    for(const r of todo){
      // 直前にもう一度確認して、入力済みなら上書きしない
      const ref=doc(db,"records",`${r.uid}_${r.date}`);
      if((await getDoc(ref)).exists()){ done++; continue; }
      await setDoc(ref,{uid:r.uid,date:r.date,entry:r.entry});
      done++; $("#go").textContent=`登録中… ${done}/${todo.length}`;
    }
    $("#go").textContent="登録する";
    busy=false; await buildPlan();
    msg(`✅ ${todo.length}日分の登録が終わりました。アプリの年次集計で数字を確認してください。確認できたらこのページ（import.html）はリポジトリから削除してください。`,"ok");
  }catch(e){ busy=false; $("#go").textContent="登録する"; msg(`途中で止まりました（${done}/${todo.length}）: ${esc(e.message)}<br>もう一度押すと、登録済みの日を飛ばして続きから再開します。`,"err"); $("#go").disabled=false; }
};
</script>
</head>
<body>
<h1>📥 Excel記録の取り込み</h1>
<div class="sub">raion 報酬計算用メモ（2026年）の記録を売上記録アプリへ移します。管理者専用・1回だけ使うページです。<br>アプリにすでに記録がある日は<b>スキップ</b>し、変更しません。何度開いても二重登録にはなりません。</div>
<div id="msg"></div>
<div id="login" class="card" style="display:none"><div class="pad">
  <input id="em" type="email" placeholder="管理者のメールアドレス">
  <input id="pw" type="password" placeholder="パスワード" onkeydown="event.key==='Enter'&&doLogin()">
  <button onclick="doLogin()">ログイン</button>
</div></div>
<div id="main" style="display:none">
  <div class="card"><h2>① スタッフの対応</h2><div class="pad" id="pickers"></div></div>
  <div id="plan"></div>
  <button id="go" onclick="runImport()" disabled>登録する</button>
  <div style="height:40px"></div>
</div>
</body>
</html>
